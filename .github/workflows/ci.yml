on: push


jobs:
  test:
    runs-on: ubuntu-latest
    env: 
        DB_USER: ${{secrets.DB_USER}}
        DB_PASSWORD: ${{secrets.DB_PASSWORD}}
        DB_NAME:  ${{secrets.DB_NAME}}



    steps:
        - uses: actions/checkout@v7
        - run:  docker compose up -d
        - run:  docker compose exec airflow airflow db check-migrations -t 300
        - run:  docker compose exec airflow airflow tasks test fake_store_pipeline create_table
        - run:  docker compose exec airflow airflow tasks test fake_store_pipeline create_products_table
        - run:  docker compose exec airflow airflow tasks test fake_store_pipeline create_user_table
        - run:  docker compose exec airflow airflow tasks test fake_store_pipeline create_reject_table
        - run:  docker compose exec airflow airflow tasks test fake_store_pipeline create_audit_table
        - run:  docker compose  exec  airflow pytest tests/test_dag.py