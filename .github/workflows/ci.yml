on: push


jobs:
  test:
    runs-on: ubuntu-latest
    env: 
        DB_USER: ${{secrets.DB_USER}}
        DB_PASSWORD: ${{secrets.DB_PASSWORD}}
        DB_NAME:  ${{secrets.DB_NAME}}



    steps:
        - uses: actions/checkout@v7
        - run:  docker compose up -d
        - run:  echo ${#DB_NAME} ${#DB_USER}
        - run:  docker compose exec fakestore_db psql -U $DB_USER -d postgres -Atc "select datname, length(datname) from pg_database"
        - run:  docker compose exec -e "DB_NAME=$DB_NAME" airflow python -c "import os; from airflow.providers.postgres.hooks.postgres import PostgresHook; c=PostgresHook(postgres_conn_id='postgres').get_connection('postgres'); print(len(c.schema or ''), len(c.login or ''), c.schema == os.environ['DB_NAME'], c.schema == c.login)"
        - run:  docker compose  exec  airflow pytest tests/test_dag.py